<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单管理</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div class="sidebar">
        <h3>小卖部管理</h3>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/products/">商品管理</a>
            <a href="/inventory/">库存管理</a>
            <a href="/orders/" class="active">订单管理</a>
            <a href="/orders/create">创建订单</a>
        </div>
        <div class="user-info">
            <p>用户：<span th:text="${session.userName} ?: '未登录'"></span></p>
            <p>角色：<span th:text="${session.userRole} ?: '-'"></span></p>
            <button onclick="logout()">退出登录</button>
        </div>
    </div>
    <div class="main">
        <h2>订单管理</h2>
        <div class="table-wrapper">
            <table id="orderTable">
                <thead><tr><th>订单号</th><th>下单时间</th><th>金额</th><th>支付方式</th><th>状态</th><th>会员</th><th>收银员</th><th>操作</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div id="detailPanel" class="form-section" style="display:none;margin-top:20px">
            <h3>订单明细</h3>
            <div class="table-wrapper">
                <table id="detailTable">
                    <thead><tr><th>商品ID</th><th>商品名称</th><th>数量</th><th>单价</th><th>小计</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
        const currentRole = /*[[${session.userRole}]]*/ 'customer';
        const canCancel = currentRole === 'manager' || currentRole === 'cashier';

        function statusTag(s){
            const map={'已支付':'success','待支付':'warning','已取消':'danger','已退款':'info'};
            return `<span class="status-tag ${map[s]||'info'}">${s}</span>`;
        }
        function loadOrders(){
            fetch('/orders/api/list').then(r=>r.json()).then(res=>{
                if(res.error_code==='AUTH_ERROR'){location.href='/login';return;}
                const tbody=document.querySelector('#orderTable tbody');
                tbody.innerHTML=res.data.map(o=>`<tr>
                <td>${o.orderId}</td><td>${o.orderTime}</td>
                <td>¥${o.totalAmount}</td><td>${o.paymentMethod}</td>
                <td>${statusTag(o.orderStatus)}</td><td>${o.memberName||'散客'}</td>
                <td>${o.employeeName||''}</td>
                <td>
                    <button onclick="showDetail('${o.orderId}')">明细</button>
                    ${canCancel && o.orderStatus!=='已取消' && o.orderStatus!=='已退款' ?
                    `<button class="danger" onclick="cancelOrder('${o.orderId}')">取消</button>` : ''}
                </td></tr>`).join('');
            });
        }
        function showDetail(oid){
            fetch('/orders/api/'+oid).then(r=>r.json()).then(res=>{
                document.getElementById('detailPanel').style.display='block';
                document.querySelector('#detailTable tbody').innerHTML=res.data.items.map(i=>`<tr>
                <td>${i.productId}</td><td>${i.productName}</td>
                <td>${i.quantity}</td><td>¥${i.unitPrice}</td><td>¥${i.subtotal}</td></tr>`).join('');
            });
        }
        function cancelOrder(oid){
            if(!confirm('确定取消订单 '+oid+'？库存将自动恢复。'))return;
            fetch('/orders/api/cancel/'+oid,{method:'POST'}).then(r=>r.json())
            .then(res=>{alert(res.message);if(res.success)loadOrders();});
        }
        function logout(){fetch('/logout',{method:'POST'}).then(()=>location.href='/login');}
        loadOrders();
    </script>
</body>
</html>
