<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品管理</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div class="sidebar">
        <h3>小卖部管理</h3>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/products/" class="active">商品管理</a>
            <a href="/inventory/">库存管理</a>
            <a href="/orders/">订单管理</a>
            <a href="/orders/create">创建订单</a>
        </div>
        <div class="user-info">
            <p>用户：<span th:text="${session.userName} ?: '未登录'"></span></p>
            <p>角色：<span th:text="${session.userRole} ?: '-'"></span></p>
            <button onclick="logout()">退出登录</button>
        </div>
    </div>
    <div class="main">
        <h2>商品管理</h2>
        <div id="managerActions" style="margin-bottom:15px;display:none">
            <button onclick="showAddForm()">新增商品</button>
        </div>
        <div id="addForm" style="display:none;margin-bottom:15px;padding:15px;border:1px solid #ddd">
            <h3>新增商品</h3>
            <input id="newId" placeholder="商品ID" style="width:120px">
            <input id="newName" placeholder="商品名称" style="width:150px">
            <input id="newPrice" placeholder="售价" type="number" step="0.01" style="width:100px">
            <input id="newUnit" placeholder="单位" style="width:80px">
            <button onclick="addProduct()">保存</button>
            <button onclick="hideAddForm()">取消</button>
        </div>
        <table id="productTable">
            <thead><tr><th>商品ID</th><th>名称</th><th>售价</th><th>单位</th><th>类别</th><th>状态</th><th>操作</th></tr></thead>
            <tbody></tbody>
        </table>
        <p id="msg"></p>
    </div>
    <script>
        let products = [];
        function loadProducts(){
            fetch('/products/api/list').then(r=>r.json()).then(res=>{
                if(res.error_code==='AUTH_ERROR'){location.href='/login';return;}
                products = res.data;
                const tbody = document.querySelector('#productTable tbody');
                tbody.innerHTML = products.map(p=>`<tr>
                    <td>${p.productId}</td><td>${p.productName}</td>
                    <td>${p.salePrice}</td><td>${p.unit||''}</td>
                    <td>${p.categoryName||''}</td><td>${p.status}</td>
                    <td><button onclick="editProduct('${p.productId}')">修改</button>
                    <button onclick="deleteProduct('${p.productId}')">删除</button></td></tr>`).join('');
            });
        }
        function showAddForm(){document.getElementById('addForm').style.display='block';}
        function hideAddForm(){document.getElementById('addForm').style.display='none';}
        function addProduct(){
            const data={productId:newId.value,productName:newName.value,salePrice:parseFloat(newPrice.value),unit:newUnit.value};
            fetch('/products/api/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
            .then(r=>r.json()).then(res=>{alert(res.message);if(res.success){loadProducts();hideAddForm();}});
        }
        function editProduct(id){
            const p=products.find(x=>x.productId===id);
            const name=prompt('商品名称',p.productName);
            if(name===null)return;
            const price=prompt('售价',p.salePrice);
            fetch('/products/api/update',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({productId:id,productName:name,salePrice:parseFloat(price),unit:p.unit})})
            .then(r=>r.json()).then(res=>{alert(res.message);if(res.success)loadProducts();});
        }
        function deleteProduct(id){
            if(!confirm('确定删除？'))return;
            fetch('/products/api/delete/'+id,{method:'POST'}).then(r=>r.json()).then(res=>{alert(res.message);if(res.success)loadProducts();});
        }
        function logout(){fetch('/logout',{method:'POST'}).then(()=>location.href='/login');}
        loadProducts();
    </script>
</body>
</html>
