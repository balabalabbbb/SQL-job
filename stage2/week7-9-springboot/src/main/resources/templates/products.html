<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品管理</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div class="sidebar">
        <h3>小卖部管理</h3>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/products/" class="active">商品管理</a>
            <a href="/inventory/">库存管理</a>
            <a href="/orders/">订单管理</a>
            <a href="/orders/create">创建订单</a>
        </div>
        <div class="user-info">
            <p>用户：<span th:text="${session.userName} ?: '未登录'"></span></p>
            <p>角色：<span th:text="${session.userRole} ?: '-'"></span></p>
            <button onclick="logout()">退出登录</button>
        </div>
    </div>
    <div class="main">
        <h2>商品管理</h2>
        <div id="managerActions" style="margin-bottom:15px;display:none">
            <button class="success" onclick="showAddForm()">+ 新增商品</button>
        </div>
        <div id="addForm" class="form-section" style="display:none">
            <h3>新增商品</h3>
            <div class="form-row">
                <label>商品ID</label><input id="newId" placeholder="如 P0010" style="width:120px">
                <label>商品名称</label><input id="newName" placeholder="商品名称" style="width:180px">
            </div>
            <div class="form-row">
                <label>售价</label><input id="newPrice" type="number" step="0.01" placeholder="0.00" style="width:100px">
                <label>进价</label><input id="newPurchase" type="number" step="0.01" placeholder="0.00" style="width:100px">
                <label>单位</label><input id="newUnit" placeholder="瓶/袋/个" style="width:80px">
                <label>类别</label>
                <select id="newCategory" style="width:120px">
                    <option value="1">日用品</option>
                    <option value="2">食品</option>
                    <option value="3">文具</option>
                    <option value="4">饮料</option>
                </select>
            </div>
            <div class="form-row">
                <button class="success" onclick="addProduct()">保存</button>
                <button onclick="hideAddForm()">取消</button>
            </div>
        </div>
        <div class="table-wrapper">
            <table id="productTable">
                <thead><tr><th>商品ID</th><th>名称</th><th>售价</th><th>进价</th><th>单位</th><th>类别</th><th>状态</th><th id="opHeader">操作</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <p id="msg"></p>
    </div>
    <script th:inline="javascript">
        const currentRole = /*[[${session.userRole}]]*/ 'customer';
        const isManager = currentRole === 'manager';
        let products = [];

        // 按角色控制界面
        if (isManager) {
            document.getElementById('managerActions').style.display = 'block';
        } else {
            document.getElementById('opHeader').style.display = 'none';
        }

        function loadProducts(){
            fetch('/products/api/list').then(r=>r.json()).then(res=>{
                if(res.error_code==='AUTH_ERROR'){location.href='/login';return;}
                products = res.data;
                const tbody = document.querySelector('#productTable tbody');
                tbody.innerHTML = products.map(p=>`<tr>
                    <td>${p.productId}</td><td>${p.productName}</td>
                    <td>¥${p.salePrice}</td><td>¥${p.purchasePrice||'-'}</td>
                    <td>${p.unit||''}</td>
                    <td>${p.categoryName||''}</td><td><span class="status-tag info">${p.status}</span></td>
                    <td class="opCell" style="${isManager?'':'display:none'}">
                        <button onclick="editProduct('${p.productId}')">修改</button>
                        <button class="danger" onclick="deleteProduct('${p.productId}')">删除</button>
                    </td></tr>`).join('');
            });
        }
        function showAddForm(){document.getElementById('addForm').style.display='block';}
        function hideAddForm(){document.getElementById('addForm').style.display='none';}
        function addProduct(){
            if(!newId.value || !newName.value){alert('请填写商品ID和名称');return;}
            const data={
                productId:newId.value, productName:newName.value,
                salePrice:parseFloat(newPrice.value)||0,
                purchasePrice:parseFloat(newPurchase.value)||0,
                unit:newUnit.value||'个', status:'在售',
                categoryId:parseInt(newCategory.value)
            };
            fetch('/products/api/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
            .then(r=>r.json()).then(res=>{alert(res.message);if(res.success){loadProducts();hideAddForm();
                newId.value='';newName.value='';newPrice.value='';newPurchase.value='';}});
        }
        function editProduct(id){
            const p=products.find(x=>x.productId===id);
            const name=prompt('商品名称',p.productName);
            if(name===null)return;
            const price=prompt('售价',p.salePrice);
            const purchase=prompt('进价',p.purchasePrice||0);
            fetch('/products/api/update',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({productId:id,productName:name,salePrice:parseFloat(price),
                purchasePrice:parseFloat(purchase),unit:p.unit,status:p.status,categoryId:p.categoryId})})
            .then(r=>r.json()).then(res=>{alert(res.message);if(res.success)loadProducts();});
        }
        function deleteProduct(id){
            if(!confirm('确定删除商品 '+id+'？'))return;
            fetch('/products/api/delete/'+id,{method:'POST'}).then(r=>r.json())
            .then(res=>{alert(res.message);if(res.success)loadProducts();});
        }
        function logout(){fetch('/logout',{method:'POST'}).then(()=>location.href='/login');}
        loadProducts();
    </script>
</body>
</html>
