<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}小卖部管理系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% if session.get('user_id') %}
    <nav class="navbar">
        <div class="nav-brand">小卖部管理系统</div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">首页</a>
            <a href="{{ url_for('product.products_page') }}">商品管理</a>
            <a href="{{ url_for('inventory.inventory_page') }}">库存管理</a>
            <a href="{{ url_for('order.orders_page') }}">订单管理</a>
            <a href="{{ url_for('order.create_page') }}">创建订单</a>
        </div>
        <div class="nav-user">
            <span>{{ session.get('user_name') }} ({{ session.get('user_role') }})</span>
            <a href="{{ url_for('auth.logout') }}" class="btn-logout">退出</a>
        </div>
    </nav>
    {% endif %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
