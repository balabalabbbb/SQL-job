{% extends "base.html" %}
{% block title %}首页 - 小卖部管理系统{% endblock %}
{% block content %}
<h2>欢迎，{{ user.get('user_name') }}</h2>
<div class="dashboard">
    <div class="card">
        <h3>系统概览</h3>
        <p>角色：{{ user.get('user_role') }}</p>
        <p>当前时间：<span id="currentTime"></span></p>
    </div>
    <div class="card">
        <h3>快捷操作</h3>
        <p><a href="{{ url_for('product.products_page') }}">商品管理</a></p>
        <p><a href="{{ url_for('inventory.inventory_page') }}">库存管理</a></p>
        <p><a href="{{ url_for('order.orders_page') }}">订单管理</a></p>
        <p><a href="{{ url_for('order.create_page') }}">创建订单</a></p>
    </div>
</div>
<script>document.getElementById('currentTime').textContent = new Date().toLocaleString();</script>
{% endblock %}
