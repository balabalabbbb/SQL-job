<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - 小卖部管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>小卖部管理系统</h2>
        <div class="login-tabs">
            <button class="tab-btn active" onclick="switchTab('employee')">员工登录</button>
            <button class="tab-btn" onclick="switchTab('member')">会员登录</button>
        </div>
        <form id="employeeForm" onsubmit="return doLogin('employee')">
            <input type="text" id="empAccount" placeholder="员工账号" required>
            <input type="password" id="empPassword" placeholder="密码" required>
            <button type="submit" class="btn-primary">登录</button>
        </form>
        <form id="memberForm" style="display:none" onsubmit="return doLogin('member')">
            <input type="text" id="memPhone" placeholder="手机号" required>
            <button type="submit" class="btn-primary">登录</button>
        </form>
        <p id="loginMsg" class="error-msg"></p>
    </div>
    <script>
        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('employeeForm').style.display = type === 'employee' ? 'block' : 'none';
            document.getElementById('memberForm').style.display = type === 'member' ? 'block' : 'none';
        }
        function doLogin(type) {
            const data = type === 'employee'
                ? { login_type: 'employee', account: document.getElementById('empAccount').value, password: document.getElementById('empPassword').value }
                : { login_type: 'member', phone: document.getElementById('memPhone').value };
            fetch('/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) })
                .then(r => r.json()).then(res => {
                    if (res.success) { window.location.href = res.redirect; }
                    else { document.getElementById('loginMsg').textContent = res.message; }
                });
            return false;
        }
    </script>
</body>
</html>
