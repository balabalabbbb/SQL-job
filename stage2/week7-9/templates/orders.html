{% extends "base.html" %}
{% block title %}订单管理{% endblock %}
{% block content %}
<h2>订单管理</h2>
<p><a href="{{ url_for('order.create_page') }}" class="btn-primary" style="display:inline-block;width:auto;padding:8px 16px;text-decoration:none">+ 创建新订单</a></p>

<table class="data-table">
    <thead><tr><th>订单号</th><th>时间</th><th>金额</th><th>支付方式</th><th>状态</th><th>会员</th><th>收银员</th><th>操作</th></tr></thead>
    <tbody id="orderTable"><tr><td colspan="8">加载中...</td></tr></tbody>
</table>

<div id="detailModal" style="display:none;margin-top:20px;padding:15px;background:#fff;border:1px solid #ddd;border-radius:4px">
    <h3>订单明细 <span id="detailOid"></span> <button onclick="document.getElementById('detailModal').style.display='none'">关闭</button></h3>
    <table class="data-table">
        <thead><tr><th>商品ID</th><th>商品名称</th><th>数量</th><th>单价</th><th>小计</th></tr></thead>
        <tbody id="detailBody"></tbody>
    </table>
</div>

<script>
function loadOrders(){
    fetch('/orders/api/list').then(r=>r.json()).then(res=>{
        const tb=document.getElementById('orderTable');
        tb.innerHTML=res.data.map(o=>`<tr>
            <td>${o.order_id}</td><td>${o.order_time}</td><td>¥${o.total_amount}</td>
            <td>${o.payment_method}</td><td>${o.order_status}</td>
            <td>${o.member_name||''}</td><td>${o.employee_name||''}</td>
            <td><button onclick="showDetail('${o.order_id}')">查看明细</button></td>
        </tr>`).join('');
    });
}
function showDetail(oid){
    fetch('/orders/api/'+oid).then(r=>r.json()).then(res=>{
        document.getElementById('detailOid').textContent=oid;
        document.getElementById('detailBody').innerHTML=res.data.items.map(i=>`<tr>
            <td>${i.product_id}</td><td>${i.product_name||''}</td><td>${i.quantity}</td><td>¥${i.unit_price}</td><td>¥${i.subtotal}</td>
        </tr>`).join('');
        document.getElementById('detailModal').style.display='block';
    });
}
loadOrders();
</script>
{% endblock %}
