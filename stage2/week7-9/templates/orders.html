{% extends "base.html" %}
{% block title %}订单管理{% endblock %}
{% block content %}
<h2>订单管理</h2>
<table class="data-table">
    <thead><tr><th>订单号</th><th>时间</th><th>金额</th><th>支付方式</th><th>状态</th><th>会员</th><th>收银员</th></tr></thead>
    <tbody id="orderTable"><tr><td colspan="7">加载中...</td></tr></tbody>
</table>
<script>
fetch('/orders/api/list').then(r=>r.json()).then(res=>{
    const tb=document.getElementById('orderTable');
    tb.innerHTML=res.data.map(o=>`<tr><td>${o.order_id}</td><td>${o.order_time}</td><td>¥${o.total_amount}</td><td>${o.payment_method}</td><td>${o.order_status}</td><td>${o.member_name||''}</td><td>${o.employee_name||''}</td></tr>`).join('');
});
</script>
{% endblock %}
