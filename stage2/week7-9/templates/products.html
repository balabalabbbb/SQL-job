{% extends "base.html" %}
{% block title %}商品管理{% endblock %}
{% block content %}
<h2>商品管理</h2>

{% if user.get('user_role') == 'manager' %}
<div class="form-box">
    <h3>新增商品</h3>
    <form id="addForm" onsubmit="return addProduct()">
        <input type="text" id="new_pid" placeholder="商品ID (如P0011)" required>
        <input type="text" id="new_pname" placeholder="商品名称" required>
        <select id="new_cid">
            <option value="1">日用品</option>
            <option value="2">食品</option>
            <option value="3">文具</option>
            <option value="4">饮料</option>
        </select>
        <input type="number" id="new_sprice" placeholder="售价" step="0.01" min="0" required>
        <input type="number" id="new_pprice" placeholder="进价" step="0.01" min="0" required>
        <input type="text" id="new_unit" placeholder="单位" value="个" required>
        <button type="submit" class="btn-primary">新增</button>
    </form>
    <p id="addMsg" class="error-msg"></p>
</div>
{% endif %}

<table class="data-table">
    <thead><tr><th>商品ID</th><th>名称</th><th>类别</th><th>售价</th><th>进价</th><th>单位</th><th>状态</th>{% if user.get('user_role') == 'manager' %}<th>操作</th>{% endif %}</tr></thead>
    <tbody id="productTable"><tr><td colspan="8">加载中...</td></tr></tbody>
</table>

<script>
let products = [];
function loadProducts(){
    fetch('/products/api/list').then(r=>r.json()).then(res=>{
        products = res.data;
        const isManager = {{ 'true' if user.get('user_role') == 'manager' else 'false' }};
        const tb=document.getElementById('productTable');
        tb.innerHTML=res.data.map(p=>`<tr>
            <td>${p.product_id}</td><td>${p.product_name}</td><td>${p.category_name||''}</td>
            <td>¥${p.sale_price}</td><td>¥${p.purchase_price}</td><td>${p.unit}</td><td>${p.status}</td>
            ${isManager?`<td><button onclick="editProduct('${p.product_id}')">修改</button> <button onclick="delProduct('${p.product_id}')">删除</button></td>`:''}
        </tr>`).join('');
    });
}
function addProduct(){
    const data={product_id:document.getElementById('new_pid').value,product_name:document.getElementById('new_pname').value,
        category_id:parseInt(document.getElementById('new_cid').value),sale_price:parseFloat(document.getElementById('new_sprice').value),
        purchase_price:parseFloat(document.getElementById('new_pprice').value),unit:document.getElementById('new_unit').value};
    fetch('/products/api/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
    .then(r=>r.json()).then(res=>{
        document.getElementById('addMsg').textContent=res.success?'新增成功！':res.message;
        if(res.success){document.getElementById('addForm').reset();loadProducts();}
    });
    return false;
}
function editProduct(pid){
    const p=products.find(x=>x.product_id===pid);
    const name=prompt('商品名称:',p.product_name);
    if(name===null)return;
    const sprice=prompt('售价:',p.sale_price);
    const pprice=prompt('进价:',p.purchase_price);
    fetch('/products/api/update',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({product_id:pid,product_name:name,category_id:p.category_id,sale_price:parseFloat(sprice),purchase_price:parseFloat(pprice),unit:p.unit})})
    .then(r=>r.json()).then(res=>{alert(res.success?'修改成功':res.message);if(res.success)loadProducts();});
}
function delProduct(pid){
    if(!confirm('确定删除商品 '+pid+' ?'))return;
    fetch('/products/api/delete/'+pid,{method:'POST'}).then(r=>r.json()).then(res=>{alert(res.success?'删除成功':res.message);if(res.success)loadProducts();});
}
loadProducts();
</script>
{% endblock %}
